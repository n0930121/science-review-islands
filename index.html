<style>
/* Layout: full-bleed diorama canvas; glass panels float at the edges (brand + card left, list right, HUD bottom). */
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --glass:#86a8a6; --wood:#b48560; --teal:#3e7c8c;
  --paper:rgba(255,251,247,.86); --paper-solid:#fffaf6; --line:rgba(33,29,29,.11); --muted:#6e625a; --live:#3bb36b;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --num:Georgia,"Times New Roman",serif;
  --shadow:0 1px 1px rgba(74,42,20,.05),0 6px 16px rgba(74,42,20,.08),0 22px 48px rgba(74,42,20,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(130% 100% at 50% 22%,#fffdf9 0%,#f6ece2 55%,#edddcf 100%);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;outline:none}
#labels{position:fixed!important;inset:0;pointer-events:none;z-index:5}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
.eyebrow{font:700 10px/1.3 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.glass{background:var(--paper);-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}

/* Buttons */
.btn{min-height:44px;min-width:44px;border-radius:9px;border:1px solid var(--line);background:var(--paper-solid);font:600 13px/1.1 var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;transition:background .15s,color .15s}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.isl-label:focus-visible,.list-btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;border:0;box-shadow:0 2px 8px #4a2a1414;padding:6px 12px;min-height:34px;font:600 12.5px/1.2 var(--font);cursor:pointer;color:var(--ink)}
.chip:hover{background:var(--yellow)}
.chip img{width:20px;height:20px}
.chip.cream{background:var(--cream)}

/* Loading */
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#fffdf9,#edddcf);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
.ld-inner{display:grid;gap:10px;text-align:center;padding:24px;max-width:520px}
.ld-title{font:800 clamp(44px,9vw,84px)/1 var(--font);letter-spacing:-.02em}
.ld-title small{display:block;font-size:.34em;font-weight:700;color:var(--coral);letter-spacing:.3em;margin-top:10px}
.ld-sub{font-size:15px;color:var(--muted)}
.ld-bar{height:6px;border-radius:9px;background:rgba(33,29,29,.08);overflow:hidden;width:220px;margin:6px auto 0}
.ld-bar i{display:block;height:100%;width:40%;background:var(--coral);border-radius:9px;animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ld-err{background:#fff;border:1px solid #e9b8a5;color:#8c2f12;border-radius:12px;padding:12px 14px;text-align:left;font-size:13px;line-height:1.6}

/* Brand */
#brand{position:fixed;z-index:12;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));width:340px;border-radius:18px;padding:14px 18px 14px;display:grid;gap:4px}
#brand h1{margin:0;font:800 30px/1.05 var(--font);letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#brand h1 small{font:700 15px/1 var(--font);color:var(--coral);letter-spacing:.2em}
#brand .brand-note{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* Tools */
#tools{position:fixed;z-index:12;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + 340px + 10px + env(safe-area-inset-left,0px));display:flex;gap:8px}
#tools .btn{box-shadow:0 2px 8px #4a2a1414;border-color:rgba(255,255,255,.8);background:var(--paper)}
#tools .btn[aria-pressed="true"]{background:var(--ink)}
#tools .btn span{font-size:12px}

/* Detail card */
#card{position:fixed;z-index:11;left:calc(16px + env(safe-area-inset-left,0px));top:var(--card-top,150px);bottom:100px;width:340px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
#card .card-scroll{overflow:auto;padding:18px 18px 20px;display:grid;gap:14px;align-content:start;overscroll-behavior:contain}
#card .x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:9px;border:0;background:transparent;font-size:22px;cursor:pointer;z-index:2}
#card .x:hover{background:var(--yellow)}
.card-head{display:flex;gap:12px;align-items:center;padding-right:40px}
.card-head h2{margin:2px 0 0;font:800 24px/1.15 var(--font);text-wrap:balance}
.hexb{--c:var(--coral);width:48px;height:54px;flex:none;display:grid;place-items:center;color:#fff;font:800 20px/1 var(--font);background:var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.summary{margin:0;font-size:14.5px;line-height:1.7}
.sec{display:grid;gap:8px}
.item-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list-btn{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;cursor:pointer;font:600 13.5px/1.35 var(--font)}
.list-btn:hover{background:var(--yellow)}
.list-btn .n{font:700 17px/1 var(--font);color:var(--coral)}
.list-btn small{font:500 11.5px/1 var(--font);color:var(--muted);white-space:nowrap}
.list-btn.lit{box-shadow:inset 3px 0 0 #e7c84a}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:160px;height:160px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#fffdf9,#f1e5d8);display:grid;place-items:center;margin:0 auto;box-shadow:inset 0 0 0 1px var(--line)}
.thumb img{width:160px;height:160px;display:block}
.desc{margin:0;font-size:14.5px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.stat{background:var(--cream);border-radius:12px;padding:10px 10px 9px;display:grid;gap:4px;align-content:start;box-shadow:inset 0 0 0 1px rgba(219,106,65,.15)}
.stat b{font:italic 400 28px/1 var(--num);color:var(--coral);font-variant-numeric:tabular-nums;word-break:break-all}
.stat span{font-weight:700;font-size:12px}
.stat small{font-size:11px;line-height:1.4;color:var(--muted)}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);position:relative;padding-top:4px}
.timeline::before{content:"";position:absolute;left:16.6%;right:16.6%;top:13px;height:2px;background:var(--stone)}
.tl{display:grid;justify-items:center;gap:6px;position:relative;font-size:12px;color:var(--muted)}
.tl i{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--stone)}
.tl.on{color:var(--ink);font-weight:700}
.tl.on i{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 4px rgba(219,106,65,.2)}
.tl.past i{background:var(--stone)}
.facts{margin:0;padding:0 0 0 18px;display:grid;gap:4px;font-size:13.5px;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:13.5px;align-items:center}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
.kv img{width:26px;height:26px}
.flowrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flowrow .arr{font:700 18px/1 var(--font);color:var(--coral)}
.evl{display:inline-block;width:42px;height:0;border-top:3px solid var(--coral)}
.evl.thematic{border-top-style:dashed}
.evl.pending{border-top-style:dotted;border-top-width:4px}
.note{margin:0;font-size:13.5px;line-height:1.7;color:#3d3431}
.back{justify-self:start}
.go-link{width:100%;background:var(--coral);color:#fff;border-color:var(--coral);font-size:15px;text-decoration:none;min-height:48px}
.go-link:hover{background:var(--ink);color:var(--cream)}
.urlrow{display:flex;gap:8px;align-items:center}
.urlrow code{flex:1;min-width:0;font:500 12px/1.4 var(--mono);background:var(--cream);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
.urlrow .btn{min-height:36px;font-size:12px}
.kind{display:inline-flex;font:700 10px/1 var(--mono);letter-spacing:1px;padding:5px 9px;border-radius:999px;background:var(--yellow);color:var(--ink)}
.kind.mindmap{background:#fde3d8;color:#9a3a17}
.item-list li,.side-body ol li{display:flex;gap:6px;align-items:stretch}
.item-list .list-btn,.side-body ol .list-btn{flex:1;min-width:0}
.go{display:grid;place-items:center;width:44px;min-height:44px;flex:none;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--coral);font:700 17px/1 var(--font);text-decoration:none}
.go:hover{background:var(--yellow)}
.go:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.grade-h{font:800 15px/1.2 var(--font);padding:10px 4px 2px;display:flex;align-items:center;gap:8px}
.unit-h{font:700 12px/1.4 var(--font);color:var(--muted);padding:6px 4px 0}
.grade-tag{pointer-events:none;background:var(--ink);color:var(--cream);border-radius:999px;padding:7px 13px;font:800 13px/1 var(--font);white-space:nowrap;box-shadow:0 4px 12px #4a2a1430;transition:opacity .3s}

/* Sidebar */
#side{position:fixed;z-index:11;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:100px;width:318px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,251,247,.72)}
.side-head{padding:16px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.side-head input{width:100%;min-height:44px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:0 12px;font:500 14px var(--font)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs .btn{font-size:13px}
.side-body{overflow:auto;padding:10px 12px 16px;display:grid;gap:6px;align-content:start;overscroll-behavior:contain}
.side-body details{border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.side-body summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;min-height:44px;padding:6px 12px;border-radius:12px;font-weight:700}
.side-body summary::-webkit-details-marker{display:none}
.side-body summary:hover{background:var(--yellow)}
.hexm{--c:var(--coral);width:34px;height:36px;display:grid;place-items:center;background:var(--c);color:#fff;font:700 11px/1 var(--mono);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.side-body .cnt{font:600 11px var(--mono);color:var(--muted)}
.side-body ol{list-style:none;margin:0;padding:0 8px 8px;display:grid;gap:4px}
.side-body .list-btn{border-color:transparent;background:transparent;font-weight:500}
.side-body .list-btn:hover{background:var(--yellow)}
.flow-btn{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;min-height:52px;width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.75);padding:8px 12px;cursor:pointer;font-family:inherit}
.flow-btn:hover{background:var(--yellow)}
.flow-btn img{width:30px;height:30px}
.flow-btn b{display:block;font-size:13.5px}
.flow-btn small{color:var(--muted);font-size:11.5px}
.empty{color:var(--muted);font-size:13px;padding:12px}
.handle{display:none}

/* HUD */
#hud{position:fixed;z-index:13;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
.clock{display:grid;padding:0 12px 0 14px;min-width:106px}

.tbtn{flex-direction:column;gap:3px;min-width:52px;padding:4px 8px;border-radius:9px;font-size:11px;background:transparent;border-color:transparent}
.tbtn b{font:italic 400 16px/1 var(--num)}
.tbtn svg{width:18px;height:18px}
.tbtn.on-seg{box-shadow:inset 0 -3px 0 var(--coral)}

#legend{position:fixed;z-index:12;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600}
#legend span{display:inline-flex;gap:6px;align-items:center}
#legend .evl{width:28px}

/* Log */
#log{position:fixed;z-index:12;top:calc(16px + env(safe-area-inset-top,0px));right:calc(var(--log-right,16px) + env(safe-area-inset-right,0px));width:300px;max-height:min(46vh,420px);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.log-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}

  const h = el.querySelector('.handle'); let start = null;
  h.addEventListener('pointerdown', e => { if (!isMobile()) return; h.setPointerCapture(e.pointerId); start = { y: e.clientY, h: el.getBoundingClientRect().height, moved: false }; el.classList.add('dragging'); });
  h.addEventListener('pointermove', e => { if (!start) return; const dy = start.y - e.clientY; if (Math.abs(dy) > 4) start.moved = true; el.style.height = clamp(start.h + dy, 60, innerHeight * .94) + 'px'; });
  const end = () => {
    if (!start) return; el.classList.remove('dragging');
    const hh = el.getBoundingClientRect().height, H = innerHeight;
    if (!start.moved) el.style.height = hh > H * .7 ? '' : (H * .94) + 'px';
    else if (hh < H * .18) { el.style.height = ''; onClose(); }
    else if (hh > H * .66) el.style.height = (H * .94) + 'px';
    else el.style.height = '';
    start = null;
  };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
}
makeSheet(cardEl, clearSelection);
makeSheet(sideEl, () => setSide(false));

/* HUD */
function fmtClock(m) { m = ((Math.floor(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
let lastClockText = '';
function updateHud() {
  const txt = fmtClock(clockMin);
  if (txt !== lastClockText) { $('#clockTime').textContent = txt; lastClockText = txt; }
  const seg = segOf(clockMin);
  if (seg !== state.seg) {
    state.seg = seg;
    $('#clockSeg').textContent = T(seg.name);
    applyHighlights();
    $$('.list-btn[data-item]').forEach(b => b.classList.toggle('lit', seg.items.includes(b.dataset.item)));
  }
  const near = [360, 720, 1080, 1260].reduce((best, m) => Math.abs(m - clockMin) < Math.abs(best - clockMin) ? m : best, 360);
  $$('#timeBtns .tbtn').forEach(b => b.classList.toggle('on-seg', +b.dataset.min === near && Math.abs(near - clockMin) < 90));
}
$$('#timeBtns .tbtn').forEach(b => b.addEventListener('click', () => { clockMin = +b.dataset.min; lastMinApplied = -1; dirty = true; }));
function toggle(id, key, after) {
  const btn = $('#' + id);
  btn.addEventListener('click', () => { state[key] = !state[key]; btn.setAttribute('aria-pressed', String(state[key])); after && after(state[key]); dirty = true; });
}
toggle('tgNames', 'showNames');
toggle('tgCarry', 'showCarry');
toggle('tgFlows', 'showFlows', updateFlowVisibility);
toggle('tgPause', 'paused');
$('#tgBird').addEventListener('click', () => setBird(!state.bird));
toggle('tgLog', 'showLog', on => { $('#log').hidden = !on; if (on) renderLog(); });
$('#timeFab').addEventListener('click', () => { const on = !document.body.classList.contains('hud-open'); document.body.classList.toggle('hud-open', on); $('#timeFab').setAttribute('aria-pressed', String(on)); });

/* log */
function renderLogFilter() {
  const sel = $('#logFilter'), v = sel.value || 'all';
  sel.innerHTML = `<option value="all">${tr('全部路線', 'All routes')}</option>` + FLOWS.map(f => `<option value="${f.id}">${esc(T(f.name))}</option>`).join('');
  sel.value = v;
}
$('#logFilter').addEventListener('change', renderLog);
function logEvent(type, w, text) {
  const now = performance.now(), last = logState.last.get(w.flow.id) || 0;
  if (now - last < 3500) return;
  logState.last.set(w.flow.id, now);
  logState.entries.unshift({ type, flow: w.flow.id, text, time: fmtClock(clockMin), who: T(D.roles[w.role]) });
  if (logState.entries.length > 60) logState.entries.length = 60;
  if (state.showLog) renderLog();
}
const EVN = { depart: ['出發', 'depart'], arrive: ['抵達', 'arrive'], handoff: ['交接', 'handoff'] };
function renderLog() {
  const f = $('#logFilter').value || 'all';
  const rows = logState.entries.filter(e => f === 'all' || e.flow === f).slice(0, 30);
  $('#logList').innerHTML = rows.map(e => `<li><time>${e.time}</time><span class="ev ${e.type}">${esc(T(EVN[e.type]))}</span><span>${esc(e.who)}：${esc(e.text)}</span></li>`).join('') || `<li style="grid-template-columns:1fr"><span>${tr('小人出發後，這裡會記錄每一次交接。', 'Each handoff appears here once the helpers start walking.')}</span></li>`;
}

/* tools */
$('#btnFull').addEventListener('click', () => { if (state.bird) setBird(false, true); flyTo(fullViewPose()); });
$('#btnList').addEventListener('click', () => setSide(!state.sideOpen));
$('#btnHelp').addEventListener('click', () => showHelp(true));
$('#helpOk').addEventListener('click', () => showHelp(false));
$('#help').addEventListener('click', e => { if (e.target.id === 'help') showHelp(false); });
function showHelp(on) { $('#help').hidden = !on; if (on) $('#helpOk').focus(); else store.set('scienceIslands.helpSeen', '1'); }
$('#btnLang').addEventListener('click', () => setLang(!EN));

/* language */
function applyStatic() {
  $$('[data-en]').forEach(el => { if (el.dataset.zh == null) el.dataset.zh = el.textContent; el.textContent = EN ? el.dataset.en : el.dataset.zh; });
  $$('[data-en-ph]').forEach(el => { if (el.dataset.zhPh == null) el.dataset.zhPh = el.placeholder; el.placeholder = EN ? el.dataset.enPh : el.dataset.zhPh; });
  $$('[data-en-aria]').forEach(el => { if (el.dataset.zhAria == null) el.dataset.zhAria = el.getAttribute('aria-label') || ''; el.setAttribute('aria-label', EN ? el.dataset.enAria : el.dataset.zhAria); });
  $$('[data-en-title]').forEach(el => { if (el.dataset.zhTitle == null) el.dataset.zhTitle = el.title; el.title = EN ? el.dataset.enTitle : el.dataset.zhTitle; });
  $$('.js-city').forEach(el => el.textContent = T(D.city));
  $$('.js-sub').forEach(el => el.textContent = T(D.subtitle));
  $$('.js-ev').forEach(el => { el.textContent = T(D.evidence[el.dataset.k].name); el.parentElement.hidden = !FLOWS.some(f => f.evidence === el.dataset.k); });
  $$('.js-eyebrow').forEach(el => el.textContent = T(D.eyebrow));
  const nItems = ISL.reduce((a, i) => a + i.items.length, 0);
  $('#brandNote').textContent = tr(`${ISL.length} 課 · ${nItems} 個連結 · 點島就能開心智圖`, `${ISL.length} lessons · ${nItems} links · tap an island to open`);
  $('#langLabel').textContent = EN ? '中' : 'EN';
  document.documentElement.lang = EN ? 'en' : 'zh-Hant';
  document.title = T(D.city) + T(['', ' · ']) + T(D.subtitle);
}
function setLang(en) {
  EN = en;
  applyStatic(); labelTexts(); bubbleText(); renderSide(); renderLogFilter(); renderLog();
  if (state.seg) $('#clockSeg').textContent = T(state.seg.name);
  if (state.sel) { const keep = cardBody.scrollTop; openCard(); cardBody.scrollTop = keep; }
  setPins(selIslandId());
  placeCard(); dirty = true;
}

/* keyboard */
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,select,textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  const step = .08;
  if (e.key === 'ArrowLeft') { orbitBy(step, 0); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { orbitBy(-step, 0); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { orbitBy(0, -step); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { orbitBy(0, step); e.preventDefault(); }
  else if (e.key === 'Escape') { if (!$('#help').hidden) showHelp(false); else if (state.sel) clearSelection(); else if (document.body.classList.contains('hud-open')) $('#timeFab').click(); }
});

/* reduced motion */
function applyReduced() {
  staticLines = reduced;
  FLOWS.forEach(f => { f.mat.uniforms.uMode.value = reduced ? 1 : f.mode; });
  if (reduced) flight = null;
  dirty = true;
}
mqReduce.addEventListener?.('change', e => { reduced = e.matches; applyReduced(); });
mqMobile.addEventListener?.('change', () => { cardEl.style.height = ''; sideEl.style.height = ''; setSide(state.sideOpen); placeCard(); syncSheetClass(); });

/* =====================================================================
   16. resize, render loop
   ===================================================================== */
function resize() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h, false); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  css2d.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  placeCard(); dirty = true;
}
new ResizeObserver(resize).observe(stage);
resize();

let last = performance.now(), simTime = 0, lastMinApplied = -1, lodState = null, firstFrame = true;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .08); last = now;
  const running = !state.paused && !reduced;
  if (running) {
    simTime += dt;
    clockMin = (clockMin + dt * 10) % 1440;
    WU.uTime.value = simTime;
    flowU.uTime.value = simTime;
    updateWalkers(dt);
    updateClouds(dt);
    dirty = true;
  }
  if (Math.floor(clockMin) !== lastMinApplied) { lastMinApplied = Math.floor(clockMin); applyTime(clockMin); updateHud(); }
  updateFlight(dt);
  if (controls.update()) dirty = true;
  if (!dirty) return;
  dirty = false;
  sky.position.copy(camera.position);
  const camDist = camera.position.distanceTo(controls.target);
  const lodOn = camDist < 26;
  gradeTags.forEach(g => { g.el.style.opacity = camDist < 15 ? '0' : '1'; });
  if (lodOn !== lodState) { lodState = lodOn; kitMeshes.forEach(m => { if (m.userData.lod) m.visible = lodOn; }); }
  buildWalkerMatrices(simTime, camDist);
  renderer.render(scene, camera);
  css2d.render(scene, camera);
  layoutLabels();
  if (state.sel?.type === 'walker' && state.cardOpen && running && Math.floor(simTime * 2) !== frame._ws) { frame._ws = Math.floor(simTime * 2); const keep = cardBody.scrollTop; cardBody.innerHTML = renderWalkerCard(walkers[state.sel.id]); cardBody.scrollTop = keep; }
  if (firstFrame) {
    firstFrame = false;
    $('#loading').classList.add('done');
    setTimeout(() => { $('#loading').hidden = true; }, 700);
    if (!store.get('scienceIslands.helpSeen')) showHelp(true);
  }
}

/* =====================================================================
   17. start
   ===================================================================== */
applyStatic();
renderSide();
renderLogFilter();
renderLog();
setSide(!MOBILE0 && innerWidth >= 1560);
// warm the log with a few walking steps
for (let i = 0; i < 40; i++) updateWalkers(.25);
const fv = fullViewPose(); camera.position.copy(fv.pos); controls.target.copy(fv.target); controls.update();
applyTime(clockMin); updateHud(); applyReduced();
requestAnimationFrame(t => { last = t; frame(t); });
}
</script>
